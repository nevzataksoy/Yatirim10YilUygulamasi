Bunlardan herhangi biri seçilecekse açık kullanıcı onayı + yeni model version + test/deploy + yeni Shadow Epoch gerekir. Mevcut v1.2.0 Shadow kanıtı yeni model semantiğine otomatik taşınmaz.

**OPEN**

