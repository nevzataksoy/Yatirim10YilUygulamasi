name: Apply Task 7 documentation result

"on":
  push:
    branches:
      - agent/portfolio-audit-reset
    paths:
      - .github/workflows/task7-doc-patch.yml

permissions:
  contents: write

jobs:
  patch-task7-result:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-audit-reset
          fetch-depth: 0

      - name: Fill Task 7 result and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          import base64
          import sys

          path = Path("INVESTMENT_ENGINE_SHADOW_GOREV_TAKVIMI_2026-07-31.md")
          text = path.read_text(encoding="utf-8")
          needle = "### Görev 6 Sonuç Çıktısı:\n//Bu Bölüm ChatGPT Codex Tarafından Doldurulacak"
          if text.count(needle) != 1:
              print(f"Expected exactly one Task 7 placeholder, found {text.count(needle)}")
              sys.exit(1)

          encoded = ""
          replacement = base64.b64decode(encoded).decode("utf-8")
          updated = text.replace(needle, replacement, 1)
          path.write_text(updated, encoding="utf-8")

          workflow = Path(".github/workflows/task7-doc-patch.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Commit and push result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INVESTMENT_ENGINE_SHADOW_GOREV_TAKVIMI_2026-07-31.md .github/workflows/task7-doc-patch.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Record Task 7 graduation assessment"
          git push origin HEAD:agent/portfolio-audit-reset
