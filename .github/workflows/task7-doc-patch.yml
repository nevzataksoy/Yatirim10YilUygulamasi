name: Apply Task 7 documentation result

"on":
  push:
    branches:
      - agent/portfolio-audit-reset
    paths:
      - .github/workflows/task7-doc-patch.yml

permissions:
  contents: write

jobs:
  patch-task7-result:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-audit-reset
          fetch-depth: 0

      - name: Fill Task 7 result and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          import sys

          path = Path("INVESTMENT_ENGINE_SHADOW_GOREV_TAKVIMI_2026-07-31.md")
          text = path.read_text(encoding="utf-8")
          needle = "### Görev 6 Sonuç Çıktısı:\n//Bu Bölüm ChatGPT Codex Tarafından Doldurulacak"
          if needle not in text:
              print("Task 7 placeholder not found; refusing to modify file.")
              sys.exit(1)

          replacement = r'''### Görev 7 Sonuç Çıktısı:

## Görev 7 sonucu: CHECKPOINT PASS — `SHADOW_READINESS=READY`, LIVE graduation `OPEN / NO-GO`

03.09.2026 tarihinde paylaşılan Görev 7 çıktıları, released v1.2.0 readiness sözleşmesindeki bütün minimum kapıların teknik olarak geçtiğini gösteriyor:

```text
