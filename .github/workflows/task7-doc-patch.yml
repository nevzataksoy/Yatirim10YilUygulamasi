Bu sonuç mevcut v1.2.0 Shadow kanıtını korur; readiness sonucunu olduğundan güçlü yorumlamaz ve görev takvimi boyunca toplanan evidence üzerine sonradan davranış değişikliği bindirmez.'''

          updated = text.replace(needle, replacement, 1)
          if updated == text:
              print("No update produced; refusing to continue.")
              sys.exit(1)
          path.write_text(updated, encoding="utf-8")

          workflow = Path(".github/workflows/task7-doc-patch.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Commit and push result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INVESTMENT_ENGINE_SHADOW_GOREV_TAKVIMI_2026-07-31.md .github/workflows/task7-doc-patch.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Record Task 7 graduation assessment"
          git push origin HEAD:agent/portfolio-audit-reset
